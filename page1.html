<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Examples</title>
</head>
<body>

    <h2>Example 1: Hello World</h2>
    <p id="out1"></p>

    <h2>Example 2: var</h2>
    <p id="out2"></p>

    <h2>Example 3: Hoisting</h2>
    <p id="out3"></p>

    <h2>Example 4: Assignment before Declaration</h2>
    <p id="out4"></p>

    <h2>Example 5: let</h2>
    <p id="out5"></p>

    <h2>Example 6: Block Scope</h2>
    <p id="out6"></p>

    <h2>Example 7: const</h2>
    <p id="out7"></p>

    <h2>Example 8: Mutable Object</h2>
    <p id="out8"></p>

    <script>

        // Example 1
        document.getElementById("out1").innerHTML = "Hello World";

        // Example 2
        var name = "John";
        name = "Doe";
        document.getElementById("out2").innerHTML = name;

        // Example 3
        document.getElementById("out3").innerHTML = age;
        var age = 25;

        // Example 4
        age2 = 25;
        var age2;
        document.getElementById("out4").innerHTML = age2;

        // Example 5
        let score = 100;
        score = 200;
        document.getElementById("out5").innerHTML = score;

        // Example 6
        let greeting = "Hello";

        if (true) {
            let greeting = "Hi";
            var message = greeting;
        }

        document.getElementById("out6").innerHTML =
            message + "<br>" + greeting;

        // Example 7
        const pi = 3.14159;
        document.getElementById("out7").innerHTML = pi;

        // Example 8
        const user = { name: "Alice", age: 25 };
        user.age = 26;

        document.getElementById("out8").innerHTML = user.age;

    </script>

</body>
</html>
